name: Release Instagram Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: '--target x86_64-pc-windows-msvc'
            target: 'x86_64-pc-windows-msvc'
            asset_os: 'Windows'
          - platform: 'ubuntu-22.04'
            args: '--target x86_64-unknown-linux-gnu'
            target: 'x86_64-unknown-linux-gnu'
            asset_os: 'Linux'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 🦀 Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: ⚡ Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: 🐧 Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            squashfs-tools \
            rpm

      - name: 🏷️ Sync Project Version with Release Tag
        shell: bash
        run: |
          RAW_TAG="${{ github.ref_type == 'tag' && github.ref_name || inputs.version || '1.0.0' }}"
          VERSION="${RAW_TAG#v}"
          echo "Synchronizing project files to release version: $VERSION"

          # Update package.json
          npm version "$VERSION" --no-git-tag-version --allow-same-version || true

          # Update tauri.conf.json
          node -e "
            const fs = require('fs');
            const file = './src-tauri/tauri.conf.json';
            const json = JSON.parse(fs.readFileSync(file, 'utf8'));
            json.version = '$VERSION';
            fs.writeFileSync(file, JSON.stringify(json, null, 2));
          "

          # Update Cargo.toml
          sed -i.bak -E "0,/^version = .*/s//version = \"$VERSION\"/" ./src-tauri/Cargo.toml && rm -f ./src-tauri/Cargo.toml.bak

      - name: 📦 Install Node dependencies
        run: npm ci || npm install

      - name: 🔨 Build Frontend
        run: npm run build

      - name: 🚀 Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version || 'v1.0.0' }}
          releaseName: 'Instagram Desktop ${{ github.ref_type == 'tag' && github.ref_name || inputs.version || 'v1.0.0' }} 🚀'
          releaseBody: |
            # 🚀 Instagram Desktop Release `${{ github.ref_type == 'tag' && github.ref_name || inputs.version || 'v1.0.0' }}`

            Welcome to the new release of **Instagram Desktop**! A fast, lightweight native desktop client for Instagram powered by **Tauri v2**, **SolidJS**, and **Rust**.

            ---

            ### ✨ Highlights & Features
            - 🔔 **Native OS Notifications**: Real-time Windows & Linux toast alerts with sound and message previews.
            - 💬 **Direct Messages Bridge**: Instant toast alerts for new DMs and direct one-click navigation to chat threads.
            - 🔴 **Unread Badge Counter**: Live badge tracking in the custom titlebar and System Tray.
            - 🪟 **System Tray Integration**: Minimize or close to background system tray seamlessly.
            - ⚡ **Ultra-Fast & Memory Efficient**: Uses native OS webview engine with minimal RAM & CPU footprint.
            - 🌙 **Modern Fluent Theme**: Sleek acrylic titlebar with Instagram signature gradients and light/dark theme sync.
            - 🧭 **Quick Navigation Toolbar**: Fast access to Home, DMs, Explore, Activity, and Profile.

            ---

            ### 📦 Download & Installation

            #### 🪟 Windows (10 / 11)
            - **`Instagram Desktop_*_x64-setup.exe`**: Standard NSIS Setup Installer.
            - **`Instagram Desktop_*_x64_en-US.msi`**: Windows Enterprise / MSI Package.

            #### 🐧 Linux (Ubuntu, Debian, Fedora, Arch Linux)
            - **`Instagram Desktop_*_amd64.AppImage`**: Portable Linux AppImage (Works across all distributions).
            - **`instagram-desktop_*_amd64.deb`**: Debian / Ubuntu package (`sudo dpkg -i instagram-desktop_*.deb`).
            - **`instagram-desktop-*_x86_64.rpm`**: Fedora / RHEL RPM package.
            - **Arch Linux**: Build and install directly using `packaging/arch/install-arch.sh` or `packaging/arch/PKGBUILD` via `makepkg -si`.

            ---

            ### 🛠️ Verification & Checksums
            All binaries are built and signed via automated GitHub Actions CI/CD.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: 🏹 Build & Upload Arch Linux .pkg.tar.zst Package
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RAW_TAG="${{ github.ref_type == 'tag' && github.ref_name || inputs.version || '1.0.0' }}"
          VERSION="${RAW_TAG#v}"
          PKG_NAME="instagram-desktop"
          ARCH_PKG_NAME="${PKG_NAME}-${VERSION}-1-x86_64.pkg.tar.zst"

          echo "Packaging ${ARCH_PKG_NAME}..."
          PKG_DIR=$(mktemp -d)
          mkdir -p "${PKG_DIR}/usr/bin"
          mkdir -p "${PKG_DIR}/usr/share/applications"
          mkdir -p "${PKG_DIR}/usr/share/icons/hicolor/32x32/apps"
          mkdir -p "${PKG_DIR}/usr/share/icons/hicolor/128x128/apps"
          mkdir -p "${PKG_DIR}/usr/share/icons/hicolor/256x256/apps"
          mkdir -p "${PKG_DIR}/usr/share/icons/hicolor/512x512/apps"

          cp "src-tauri/target/${{ matrix.target }}/release/${PKG_NAME}" "${PKG_DIR}/usr/bin/${PKG_NAME}" 2>/dev/null || cp "src-tauri/target/release/${PKG_NAME}" "${PKG_DIR}/usr/bin/${PKG_NAME}"
          cp "packaging/arch/${PKG_NAME}.desktop" "${PKG_DIR}/usr/share/applications/${PKG_NAME}.desktop"
          cp "src-tauri/icons/32x32.png" "${PKG_DIR}/usr/share/icons/hicolor/32x32/apps/${PKG_NAME}.png"
          cp "src-tauri/icons/128x128.png" "${PKG_DIR}/usr/share/icons/hicolor/128x128/apps/${PKG_NAME}.png"
          cp "src-tauri/icons/128x128@2x.png" "${PKG_DIR}/usr/share/icons/hicolor/256x256/apps/${PKG_NAME}.png"
          cp "src-tauri/icons/icon.png" "${PKG_DIR}/usr/share/icons/hicolor/512x512/apps/${PKG_NAME}.png"

          INSTALLED_SIZE=$(du -sb "${PKG_DIR}/usr" | awk '{print $1}')
          BUILDDATE=$(date +%s)

          cat <<EOF > "${PKG_DIR}/.PKGINFO"
pkgname = ${PKG_NAME}
pkgbase = ${PKG_NAME}
pkgver = ${VERSION}-1
pkgdesc = Official Instagram Web Desktop Client with Native Notifications and System Tray
url = https://github.com/rootLocalGhost/Instagram-Next
builddate = ${BUILDDATE}
packager = rootLocalGhost <rootlocalghost@gmail.com>
size = ${INSTALLED_SIZE}
arch = x86_64
license = MIT
depend = webkit2gtk-4.1
depend = gtk3
depend = libayatana-appindicator
depend = openssl
depend = cairo
depend = gdk-pixbuf2
depend = glib2
depend = pango
depend = hicolor-icon-theme
provides = ${PKG_NAME}
conflict = ${PKG_NAME}-bin
EOF

          (cd "${PKG_DIR}" && tar -c --zstd -f "${GITHUB_WORKSPACE}/${ARCH_PKG_NAME}" .PKGINFO usr)
          gh release upload "${{ github.ref_type == 'tag' && github.ref_name || inputs.version || 'v1.0.0' }}" "${GITHUB_WORKSPACE}/${ARCH_PKG_NAME}" --clobber
