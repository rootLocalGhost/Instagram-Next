name: Release Instagram Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: '--target x86_64-pc-windows-msvc'
            target: 'x86_64-pc-windows-msvc'
            asset_os: 'Windows'
          - platform: 'ubuntu-22.04'
            args: '--target x86_64-unknown-linux-gnu'
            target: 'x86_64-unknown-linux-gnu'
            asset_os: 'Linux'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 🦀 Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: ⚡ Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: 🐧 Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            squashfs-tools

      - name: 📦 Install Node dependencies
        run: npm ci

      - name: 🔨 Build Frontend
        run: npm run build

      - name: 🚀 Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name || inputs.version }}
          releaseName: 'Instagram Desktop ${{ github.ref_name || inputs.version }} 🚀'
          releaseBody: |
            # 🚀 Instagram Desktop Release `${{ github.ref_name || inputs.version }}`

            Welcome to the new release of **Instagram Desktop**! A fast, lightweight native desktop client for Instagram powered by **Tauri v2**, **SolidJS**, and **Rust**.

            ---

            ### ✨ Highlights & Features
            - 🔔 **Native OS Notifications**: Real-time Windows & Linux toast alerts with sound and message previews.
            - 💬 **Direct Messages Bridge**: Instant toast alerts for new DMs and direct one-click navigation to chat threads.
            - 🔴 **Unread Badge Counter**: Live badge tracking in the custom titlebar and System Tray.
            - 🪟 **System Tray Integration**: Minimize or close to background system tray seamlessly.
            - ⚡ **Ultra-Fast & Memory Efficient**: Uses native OS webview engine with minimal RAM & CPU footprint.
            - 🌙 **Modern Fluent Theme**: Sleek acrylic titlebar with Instagram signature gradients and light/dark theme sync.
            - 🧭 **Quick Navigation Toolbar**: Fast access to Home, DMs, Explore, Activity, and Profile.

            ---

            ### 📦 Download & Installation

            #### 🪟 Windows (10 / 11)
            - **`Instagram.Desktop_${{ github.ref_name || inputs.version }}_x64-setup.exe`**: Standard NSIS Setup Installer.
            - **`Instagram.Desktop_${{ github.ref_name || inputs.version }}_x64_en-US.msi`**: Windows Enterprise / MSI Package.

            #### 🐧 Linux (Ubuntu, Debian, Fedora, Arch Linux)
            - **`Instagram.Desktop_${{ github.ref_name || inputs.version }}_amd64.AppImage`**: Portable Linux AppImage (Works across all distributions).
            - **`instagram-desktop_${{ github.ref_name || inputs.version }}_amd64.deb`**: Debian / Ubuntu package (`sudo dpkg -i ...deb`).
            - **`instagram-desktop-${{ github.ref_name || inputs.version }}-1.x86_64.rpm`**: Fedora / RHEL RPM package.
            - **Arch Linux**: Build directly using the included `packaging/arch/PKGBUILD` via `makepkg -si`.

            ---

            ### 🛠️ Verification & Checksums
            All binaries are signed and built via automated GitHub Actions CI/CD.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
