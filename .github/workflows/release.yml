name: 'Release Instagram Desktop'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.1)'
        required: true
        default: 'v1.0.1'
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false
      draft:
        description: 'Create as draft release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # ==========================================
  # 1. BUILD WINDOWS & UBUNTU / LINUX PACKAGES
  # ==========================================
  build-tauri:
    name: 'Build (${{ matrix.platform }})'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-x86_64'
            os: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
          - platform: 'linux-x86_64'
            os: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            rpm

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend and Tauri bundle
        run: npm run tauri build

      - name: Stage Windows release artifacts
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          mkdir -p artifacts
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe artifacts/ -ErrorAction SilentlyContinue
          Copy-Item src-tauri/target/release/bundle/msi/*.msi artifacts/ -ErrorAction SilentlyContinue
          
          # Create portable standalone zip
          $portableDir = "Instagram-Desktop-Portable"
          New-Item -ItemType Directory -Path $portableDir -Force
          Copy-Item src-tauri/target/release/instagram-desktop.exe "$portableDir/"
          Compress-Archive -Path "$portableDir/*" -DestinationPath "artifacts/Instagram-Desktop-Windows-Portable.zip"

      - name: Stage Linux release artifacts
        if: matrix.os == 'ubuntu-22.04'
        run: |
          mkdir -p artifacts
          cp src-tauri/target/release/bundle/deb/*.deb artifacts/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/appimage/*.AppImage artifacts/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/rpm/*.rpm artifacts/ 2>/dev/null || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.platform }}
          path: artifacts/*
          if-no-files-found: warn

  # ==========================================
  # 2. BUILD ARCH LINUX NATIVE PACKAGE (.pkg.tar.zst)
  # ==========================================
  build-arch:
    name: 'Build Arch Linux Package'
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Arch dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm \
            base-devel \
            nodejs \
            npm \
            rust \
            cargo \
            webkit2gtk-4.1 \
            libayatana-appindicator \
            openssl \
            gtk3 \
            hicolor-icon-theme \
            xdg-utils \
            file \
            patchelf \
            zstd

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend & compile release binary
        run: |
          npm run build
          cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Assemble Arch Linux .pkg.tar.zst
        run: |
          mkdir -p /tmp/pkg-build/pkg/usr/bin
          mkdir -p /tmp/pkg-build/pkg/usr/share/applications
          mkdir -p /tmp/pkg-build/pkg/usr/share/icons/hicolor/128x128/apps
          mkdir -p /tmp/pkg-build/pkg/usr/share/icons/hicolor/32x32/apps

          cp src-tauri/target/release/instagram-desktop /tmp/pkg-build/pkg/usr/bin/instagram-desktop
          chmod 755 /tmp/pkg-build/pkg/usr/bin/instagram-desktop
          cp packaging/arch/instagram-desktop.desktop /tmp/pkg-build/pkg/usr/share/applications/
          cp src-tauri/icons/128x128.png /tmp/pkg-build/pkg/usr/share/icons/hicolor/128x128/apps/instagram-desktop.png
          cp src-tauri/icons/32x32.png /tmp/pkg-build/pkg/usr/share/icons/hicolor/32x32/apps/instagram-desktop.png

          # Generate Arch Linux package metadata (.PKGINFO)
          PKG_SIZE=$(du -sb /tmp/pkg-build/pkg | awk '{print $1}')
          BUILD_DATE=$(date +%s)
          cat << EOF > /tmp/pkg-build/pkg/.PKGINFO
pkgname = instagram-desktop
pkgver = 1.0.0-1
pkgdesc = Official Instagram Web Desktop Client with Native Notifications
url = https://github.com/rootLocalGhost/Instagram-Next
builddate = ${BUILD_DATE}
packager = localghost
size = ${PKG_SIZE}
arch = x86_64
license = MIT
depend = webkit2gtk-4.1
depend = libayatana-appindicator
depend = gtk3
depend = openssl
depend = hicolor-icon-theme
EOF

          mkdir -p "${GITHUB_WORKSPACE}/arch-artifacts"
          cd /tmp/pkg-build/pkg
          tar -c -I 'zstd -19 -T0' -f "${GITHUB_WORKSPACE}/arch-artifacts/instagram-desktop-1.0.0-1-x86_64.pkg.tar.zst" .

      - name: Upload Arch artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-arch-linux
          path: arch-artifacts/*

  # ==========================================
  # 3. PUBLISH GITHUB RELEASE & RELEASE NOTES
  # ==========================================
  publish-release:
    name: 'Publish GitHub Release'
    needs: [build-tauri, build-arch]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          merge-multiple: true

      - name: Generate SHA256 Checksums
        run: |
          cd all-artifacts
          sha256sum * > SHA256SUMS.txt || true
          echo "Generated SHA256SUMS.txt:"
          cat SHA256SUMS.txt

      - name: Generate Automated Emoji Release Notes
        id: release_notes
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "main" ]; then
            TAG_NAME="${{ inputs.version || 'v1.0.1' }}"
          fi
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

          cat << EOF > release_notes.md
          ## 📸 Instagram Desktop - Official Web Client

          A modern, high-performance desktop application for Instagram built with **Tauri v2**, **Solid.js**, **Rust**, **TypeScript**, and **Native CSS**.

          ---

          ### ✨ Highlights & Features

          - 🔔 **First-Class Native Notifications**: Native Windows 10/11 & Linux desktop toast notifications with sound and message previews.
          - 💬 **Direct Messages Bridge**: Instant toast alerts for new DMs and direct one-click jump to conversation threads.
          - 🔴 **Unread Badge Counters**: Pulsing notification badges in the custom titlebar and unread count tracker.
          - 🪟 **System Tray Integration**: Runs silently in the background so you never miss an alert or DM.
          - 🧭 **Quick Navigation Toolbar**: Fast access to Home Feed, Direct Messages (\`/direct/inbox\`), Explore, and Activity.
          - 🔍 **Zoom & Viewport Controls**: Quick scale adjustment (\`80%\` – \`150%\`) with \`Ctrl + =\` / \`Ctrl + -\`.
          - 🌙 **Modern Fluent Theme**: Sleek acrylic titlebar with Instagram signature color gradients and dark/light mode sync.

          ---

          ### 📦 Download & Installers

          | Platform | Package Type | File | Description |
          | :--- | :--- | :--- | :--- |
          | 🪟 **Windows** | Setup Installer (\`.exe\`) | \`Instagram Desktop_*_x64-setup.exe\` | Standard Windows NSIS installer |
          | 🪟 **Windows** | MSI Package (\`.msi\`) | \`Instagram Desktop_*_x64_en-US.msi\` | Windows Installer package |
          | 🪟 **Windows** | Portable Zip (\`.zip\`) | \`Instagram-Desktop-Windows-Portable.zip\` | No installation required |
          | 🐧 **Linux** | Universal AppImage | \`Instagram Desktop_*_amd64.AppImage\` | Run anywhere on Linux (\`chmod +x\`) |
          | 🐧 **Debian / Ubuntu** | Debian Package (\`.deb\`) | \`instagram-desktop_*_amd64.deb\` | \`sudo dpkg -i ...\` |
          | 🐧 **Fedora / RHEL** | RPM Package (\`.rpm\`) | \`instagram-desktop-*_x86_64.rpm\` | \`sudo dnf install ...\` |
          | 🏹 **Arch Linux** | Arch Package (\`.pkg.tar.zst\`) | \`instagram-desktop-*-x86_64.pkg.tar.zst\` | \`sudo pacman -U ...\` |

          ---

          ### 🏹 Arch Linux / Manjaro Quick Install
          \`\`\`bash
          # Using the prebuilt Arch package:
          sudo pacman -U instagram-desktop-*-x86_64.pkg.tar.zst

          # Or using the included PKGBUILD:
          cd packaging/arch && makepkg -si
          \`\`\`

          ---

          ### 🔑 SHA-256 Checksums
          Refer to \`SHA256SUMS.txt\` attached below to verify file integrity.

          ---
          **Full Changelog**: https://github.com/${{ github.repository }}/commits/\${TAG_NAME}
          EOF

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_notes.outputs.tag_name }}
          name: Instagram Desktop ${{ steps.release_notes.outputs.tag_name }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            all-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
